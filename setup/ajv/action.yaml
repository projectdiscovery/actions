name: 'Setup Ajv CLI'
description: "Install Ajv CLI - The fastest JSON schema Validator"

inputs:
  node-version:
    description: 'Specify Node version'
    required: false
    default: 'latest'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '${{ inputs.node-version }}'
    - run: npm i -g ajv-cli
      shell: bash
