name: 'Setup Go'
description: 'Run actions/setup-go'

inputs:
  go-version:
    description: 'The Go version to download (if necessary) and use. Supports semver spec and ranges. Be sure to enclose this option in single quotation marks.'
  go-version-file:
    description: 'Path to the go.mod, go.work, alternate .mod, .go-version, or .tool-versions file.'
  check-latest:
    description: 'Set this option to true if you want the action to always check for the latest available version that satisfies the version spec'
    default: 'true'
  token:
    description: Used to pull Go distributions from go-versions. Since there's a default, this is typically not supplied by the user. When running this action on github.com, the default value is sufficient. When running on GHES, you can pass a personal access token for github.com if you are experiencing rate limiting.
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
  cache:
    description: Used to specify whether caching is needed. Set to true, if you'd like to enable caching.
    default: 'true'
  cache-dependency-path:
    description: 'Used to specify the path to a dependency file (e.g., go.mod, go.sum)'
    default: '**/go.mod'
  architecture:
    description: 'Target architecture for Go to use. Examples: x86, x64. Will use system architecture by default.'
  go-download-base-url:
    description: 'Custom base URL for downloading Go distributions. Use this to download Go from a mirror or custom source. Defaults to "https://go.dev/dl". Can also be set via the GO_DOWNLOAD_BASE_URL environment variable. The input takes precedence over the environment variable.'

runs:
  using: "composite"
  steps:
    # actions/setup-go reads the version only from go.mod, go.work, .go-version
    # and .tool-versions. It reads any other file (for example go.tool.mod) as a
    # raw version string. This step reads the toolchain or go directive of
    # go.mod, go.work and other .mod files and gives the result as go-version.
    # If it finds no directive, it gives the file to actions/setup-go unchanged.
    - id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.go-version }}
        INPUT_VERSION_FILE: ${{ inputs.go-version == '' && (inputs.go-version-file || 'go.mod') || inputs.go-version-file }}
      run: |
        version=""
        version_file="$INPUT_VERSION_FILE"
        if [ -n "$INPUT_VERSION" ]; then
          version="$INPUT_VERSION"
        else
          case "$(basename -- "$version_file")" in
            go.work | *.mod)
              if [ -f "$version_file" ]; then
                parsed=""
                # Read the toolchain directive first, see https://go.dev/ref/mod#go-mod-file-toolchain.
                if [ "${GOTOOLCHAIN:-}" != "local" ]; then
                  parsed=$(grep -m1 -E '^toolchain[[:space:]]+go1\.[0-9]+(\.[0-9]+|(beta|rc)[0-9]+)?([[:space:]-]|$)' -- "$version_file" \
                    | sed -E 's/^toolchain[[:space:]]+go(1\.[0-9]+(\.[0-9]+|(beta|rc)[0-9]+)?).*$/\1/') || true
                fi
                # Fall back to the go directive, see https://go.dev/ref/mod#go-mod-file-go.
                if [ -z "$parsed" ]; then
                  parsed=$(grep -m1 -E '^go[[:space:]]+[0-9]+(\.[0-9]+)*((beta|rc)[0-9]+)?([[:space:]]|$)' -- "$version_file" \
                    | sed -E 's/^go[[:space:]]+([0-9]+(\.[0-9]+)*((beta|rc)[0-9]+)?).*$/\1/') || true
                fi
                if [ -n "$parsed" ]; then
                  version="$parsed"
                  version_file=""
                fi
              fi
              ;;
          esac
        fi
        {
          echo "go-version=$version"
          echo "go-version-file=$version_file"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.version.outputs.go-version }}
        go-version-file: ${{ steps.version.outputs.go-version-file }}
        check-latest: ${{ inputs.check-latest }}
        token: ${{ inputs.token }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        architecture: ${{ inputs.architecture }}
        go-download-base-url: ${{ inputs.go-download-base-url }}
