name: 'Setup Python'
description: 'Run actions/setup-python'

inputs:
  python-version:
    description: 'Setup with specific version'
    required: false
    default: '3.10'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        check-latest: true
        python-version: '${{ inputs.python-version }}'
