name: 'Commit files'
description: "Run git-commit"

inputs:
  files:
    description: 'Files to commit (newline-separated)'
    required: true
    default: '.'
  message:
    description: 'Commit message'
    required: true
    default: ''
  gpg-sign:
    description: 'Sign the commit. `true` signs with the key git picks by default (`user.signingKey` when it is set), `false` skips signing even when `commit.gpgSign` is set, and any other value is the key ID, or for SSH the key path. The key must already be loaded into git or gpg, and `gpg.format` selects the signature type. If not provided, git config decides.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - run: $GITHUB_ACTION_PATH/main.sh
      env:
        FILES: '${{ inputs.files }}'
        MESSAGE: '${{ inputs.message }}'
        GPG_SIGN: '${{ inputs.gpg-sign }}'
      shell: bash
